server {
    listen 80;
    server_name todo.nf.la;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name todo.nf.la;

    ssl_certificate     /etc/letsencrypt/live/todo.nf.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.nf.la/privkey.pem;

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://node:3000;
    }
}
